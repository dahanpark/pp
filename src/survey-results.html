<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>프라이어팰리스 대수선 주민 의견조사 결과 · 246건 집계</title>
  <style>
    :root { color-scheme:light; --navy:#0f172a; --blue:#2157d5; --ink:#19243a; --muted:#607087; --line:#dbe4f0; --paper:#f2f6fc; --green:#078263; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:#dce5f2; color:var(--ink); font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
    .screen-nav { max-width:1122px; margin:0 auto; padding:15px 18px; display:flex; align-items:center; justify-content:space-between; gap:16px; color:#dbeafe; background:var(--navy); }
    .screen-nav b { font-size:14px; }
    .screen-nav nav { display:flex; flex-wrap:wrap; gap:7px; }
    .screen-nav a { padding:7px 10px; border:1px solid #617699; border-radius:999px; color:#fff; font-size:12px; text-decoration:none; }
    main { max-width:1122px; margin:auto; }
    .survey-page { width:100%; aspect-ratio:297/210; min-height:0; padding:31px 42px 24px; display:flex; flex-direction:column; gap:15px; background:var(--paper); border-bottom:1px solid #c4d2e5; }
    .page-head { display:flex; justify-content:space-between; align-items:flex-start; gap:18px; min-height:90px; }
    .survey-method { flex:0 0 320px; display:grid; gap:2px; padding:8px 10px; border:1px solid #c7d9f6; border-radius:10px; background:#eaf2ff; color:#3f5575; font-size:10px; line-height:1.25; }
    .survey-method b { color:#1d4ed8; font-size:11px; }
    .eyebrow { color:var(--blue); font-size:13px; font-weight:900; letter-spacing:.06em; }
    .page-head h1 { margin:5px 0 0; color:var(--navy); font-size:31px; line-height:1.15; letter-spacing:-.045em; }
    .page-head p { margin:6px 0 0; color:var(--muted); font-size:12px; }
    .page-index { flex:none; padding:8px 12px; border-radius:999px; background:#dce9ff; color:#1749b9; font-size:13px; font-weight:900; }
    .question-grid { min-height:0; flex:1; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); grid-template-rows:repeat(2,minmax(0,1fr)); gap:12px; }
    .survey-page.last .question-grid { grid-template-rows:minmax(0,1fr); }
    .question-card { min-width:0; min-height:0; display:flex; flex-direction:column; gap:8px; padding:15px 17px 13px; overflow:hidden; border:1px solid var(--line); border-top:4px solid var(--blue); border-radius:17px; background:#fff; box-shadow:0 5px 16px #0b2d6610; }
    .question-head { display:flex; gap:10px; align-items:flex-start; }
    .question-no { flex:none; display:grid; place-items:center; width:29px; height:29px; border-radius:9px; background:#dce9ff; color:#1d4ed8; font-size:13px; font-weight:900; }
    .question-head h2 { margin:0; color:var(--ink); font-size:17px; line-height:1.28; letter-spacing:-.035em; word-break:keep-all; }
    .question-head .meta { margin:4px 0 0; color:#75849a; font-size:11.5px; font-weight:700; }
    .chart { min-height:0; flex:1; display:flex; align-items:center; gap:12px; }
    .chart-donut { justify-content:flex-start; }
    .donut { position:relative; width:124px; height:124px; flex:none; display:grid; place-items:center; border-radius:50%; }
    .donut::before { content:""; position:absolute; inset:23px; border-radius:50%; background:#fff; }
    .donut-center { position:relative; width:78px; text-align:center; color:var(--navy); }
    .donut-center strong { display:block; font-size:24px; line-height:1.05; }
    .donut-center small { display:block; margin-top:2px; color:var(--muted); font-size:10px; line-height:1.2; word-break:keep-all; }
    .legend { min-width:0; flex:1; display:grid; gap:4px; margin:0; padding:0; list-style:none; }
    .legend li { display:grid; grid-template-columns:8px minmax(0,1fr) auto; align-items:center; gap:5px; color:#41516a; font-size:12px; line-height:1.15; }
    .legend i { display:block; width:8px; height:8px; border-radius:50%; background:var(--swatch); }
    .legend span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .legend b { color:var(--ink); font-size:12px; white-space:nowrap; }
    .bar-list { align-self:stretch; width:100%; display:grid; align-content:center; gap:5px; }
    .bar-row { display:grid; grid-template-columns:minmax(0,160px) minmax(0,1fr) 52px; align-items:center; gap:7px; font-size:12px; line-height:1.1; }
    .bar-row .label { min-width:0; color:#40516b; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .bar-row .track { height:10px; border-radius:999px; overflow:hidden; background:#e9eff8; }
    .bar-row .fill { height:100%; border-radius:999px; background:var(--bar,#3974e4); }
    .bar-row strong { text-align:right; color:#1f3e83; font-size:12px; white-space:nowrap; }
    .chart-stack { display:flex; flex-direction:column; align-items:stretch; justify-content:center; gap:10px; }
    .stack { display:flex; width:100%; height:25px; overflow:hidden; border-radius:9px; background:#e9eff8; }
    .stack span { height:100%; min-width:2px; background:var(--swatch); }
    .stack-legend { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); column-gap:10px; row-gap:5px; }
    .stack-legend div { display:grid; grid-template-columns:8px minmax(0,1fr) auto; gap:5px; align-items:center; color:#475569; font-size:11.5px; }
    .stack-legend i { width:8px; height:8px; border-radius:50%; background:var(--swatch); }
    .stack-legend span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .stack-legend b { color:#243750; white-space:nowrap; }
    .has-examples .stack-legend div { align-items:start; }
    .has-examples .stack-legend span { overflow:visible; white-space:normal; }
    .has-examples .stack-legend small { display:block; margin-top:3px; color:#697891; font-size:10px; font-weight:500; line-height:1.25; }
    .building-columns { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; width:100%; }
    .building-column { display:grid; gap:3px; }
    .building-row { display:grid; grid-template-columns:32px minmax(0,1fr) 26px; align-items:center; gap:5px; min-height:13px; color:#40516b; font-size:11px; line-height:1; }
    .building-row b { color:#1f3e83; text-align:right; white-space:nowrap; }
    .building-track { height:7px; overflow:hidden; border-radius:999px; background:#e9eff8; }
    .building-track i { display:block; height:100%; border-radius:999px; background:#3974e4; }
    .chart-themes { align-items:stretch; }
    .themes { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-content:center; gap:8px; width:100%; }
    .theme { padding:11px; border-radius:11px; background:#eff5ff; border:1px solid #d5e4ff; }
    .theme b { display:block; color:#244a9d; font-size:13px; }
    .theme span { display:block; margin-top:3px; color:#52647f; font-size:10.5px; line-height:1.3; }
    .theme-head { display:flex; justify-content:space-between; align-items:flex-start; gap:6px; }
    .theme-head em { flex:none; padding:2px 6px; border-radius:999px; background:#dbe9ff; color:#1d4ed8; font-size:11px; font-style:normal; font-weight:900; white-space:nowrap; }
    .detail-note { margin:-3px 0 0; color:#748197; font-size:10px; line-height:1.25; }
    .other-summary { margin:0; padding:6px 8px; border-left:3px solid #91a8d1; background:#f6f8fc; color:#465875; font-size:10.5px; line-height:1.3; word-break:keep-all; }
    .other-summary strong { color:#2d4d89; }
    .has-other { gap:5px; padding:12px 16px 11px; }
    .has-other .bar-list { gap:3px; }
    .has-other .bar-row { font-size:11px; line-height:1; }
    .has-other .bar-row .track { height:8px; }
    .has-other .bar-row strong { font-size:11px; }
    .has-other .other-summary { padding:5px 7px; font-size:10px; line-height:1.2; }
    .has-other .detail-note { margin:0; font-size:9px; }
    .has-other .insight { padding:8px 9px; font-size:14px; line-height:1.32; }
    .insight { margin:0; padding:9px 11px; border-radius:9px; background:#172b52; color:#fff; font-size:15px; line-height:1.38; word-break:keep-all; font-weight:650; }
    .insight strong { color:#bfdbfe; font-weight:900; }
    .is-buildings { gap:5px; padding:12px 14px 10px; }
    .is-buildings .insight { padding:8px 9px; font-size:14px; line-height:1.32; }
    .page-foot { display:flex; justify-content:space-between; gap:20px; min-height:15px; color:#73839b; font-size:10px; line-height:1.35; }
    .page-foot span:last-child { flex:none; }
    .last .question-card { padding:19px 21px; }
    .last .question-head h2 { font-size:19px; }
    .last .chart { gap:18px; }
    .last .donut { width:180px; height:180px; }
    .last .donut::before { inset:36px; }
    .last .donut-center strong { font-size:31px; }
    .last .legend { gap:12px; }
    .last .legend li, .last .legend b { font-size:13px; }
    .last .theme { padding:12px; }
    .last .theme b { font-size:14px; }
    .last .theme span { font-size:11px; }
    .last .theme-head em { font-size:12px; }
    .last .insight { font-size:16px; padding:11px 13px; }
    .last .detail-note { font-size:10.5px; }
    .screen-only { display:block; }
    details.buildings { margin-top:2px; color:#2853a4; font-size:10px; }
    details.buildings summary { cursor:pointer; font-weight:800; }
    details.buildings p { margin:4px 0 0; color:#52647f; line-height:1.4; }
    @page { size:A4 landscape; margin:0; }
    @media print {
      html, body { width:297mm; margin:0; background:#fff; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      .screen-nav, .screen-only { display:none!important; }
      main { max-width:none; }
      .survey-page { width:297mm; height:210mm; aspect-ratio:auto; page-break-after:always; break-after:page; border:0; }
      .survey-page:last-child { page-break-after:auto; break-after:auto; }
    }
    @media (max-width:700px) {
      body { background:var(--paper); }
      .screen-nav { align-items:flex-start; flex-direction:column; gap:8px; padding:10px 16px; }
      .screen-nav nav { gap:5px; }
      .screen-nav a { padding:5px 8px; font-size:11px; }
      .survey-page { width:auto; min-height:0; aspect-ratio:auto; padding:24px 16px 18px; gap:16px; }
      .page-head { min-height:0; align-items:flex-start; flex-direction:column; }
      .survey-method { flex:auto; width:100%; font-size:11px; line-height:1.4; }
      .page-head h1 { font-size:26px; }
      .page-head p { font-size:12px; line-height:1.45; }
      .page-index { padding:6px 8px; font-size:11px; }
      .question-grid, .survey-page.last .question-grid { display:flex; flex-direction:column; gap:13px; }
      .question-card, .last .question-card { min-height:0; padding:17px 16px; gap:13px; overflow:visible; }
      .question-head h2, .last .question-head h2 { font-size:18px; }
      .question-head .meta { font-size:11px; }
      .chart { min-height:125px; }
      .donut, .last .donut { width:116px; height:116px; }
      .donut::before, .last .donut::before { inset:23px; }
      .donut-center strong, .last .donut-center strong { font-size:22px; }
      .legend, .last .legend { gap:6px; }
      .legend li, .last .legend li, .legend b, .last .legend b { font-size:11px; }
      .bar-list { gap:8px; padding:5px 0; }
      .bar-row { grid-template-columns:minmax(0,125px) minmax(0,1fr) 52px; font-size:11px; }
      .bar-row strong { font-size:11px; }
      .bar-row .track { height:11px; }
      .stack-legend div { font-size:11px; }
      .has-examples .stack-legend { grid-template-columns:1fr; row-gap:8px; }
      .has-examples .stack-legend div { font-size:12px; }
      .has-examples .stack-legend small { font-size:11px; }
      .building-columns { grid-template-columns:1fr; gap:6px; }
      .building-column { gap:6px; }
      .building-row { grid-template-columns:42px minmax(0,1fr) 34px; min-height:17px; font-size:12px; }
      .building-track { height:8px; }
      .is-buildings { gap:13px; padding:17px 16px; }
      .is-buildings .insight { padding:10px 11px; font-size:15px; line-height:1.5; }
      .themes { grid-template-columns:1fr; }
      .theme, .last .theme { padding:10px; }
      .theme b, .last .theme b { font-size:13px; }
      .theme span, .last .theme span { font-size:11px; }
      .insight, .last .insight { font-size:15px; line-height:1.5; padding:10px 11px; }
      .detail-note, .last .detail-note { font-size:10.5px; }
      .other-summary { font-size:11px; line-height:1.4; padding:8px 10px; }
      .has-other .other-summary { font-size:11px; line-height:1.4; padding:8px 10px; }
      .page-foot { font-size:10px; }
    }
    @media (max-width:360px) {
      .chart-donut { gap:8px; }
      .donut, .last .donut { width:102px; height:102px; }
      .donut::before, .last .donut::before { inset:20px; }
      .legend li, .last .legend li, .legend b, .last .legend b { font-size:10px; }
      .bar-row { grid-template-columns:minmax(0,100px) minmax(0,1fr) 49px; gap:5px; }
    }
  </style>
</head>
<body>
  <div class="screen-nav"><b>프라이어팰리스 · 10월 설문 결과</b><nav aria-label="설문 페이지 이동"><a href="#page-1">Q1–4</a><a href="#page-2">Q5–8</a><a href="#page-3">Q9–12</a><a href="#page-4">Q13–14</a></nav></div>
  <main id="survey-pages"></main>
  <script src="./survey-renderer.js"></script>
</body>
</html>
